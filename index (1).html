<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wali Cloth House</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #faf7f2; color: #222; text-align: center; }
    header { background: linear-gradient(135deg, #1a1a1a, #4a3b2a); color: white; padding: 40px 20px; }
    header h1 { margin: 0; font-size: 32px; letter-spacing: 1px; }
    header p { margin: 10px 0 0; color: #e8d9b5; }
    h2 { margin: 30px 0 10px; color: #4a3b2a; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 16px; }
    .card { background: white; padding: 10px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); font-weight: bold; }
    .card img { width: 100%; border-radius: 8px; }
    .btn { display: inline-block; margin: 30px 0; background: #25d366; color: white; padding: 14px 30px; border-radius: 30px; text-decoration: none; font-size: 18px; }
    footer { background: #1a1a1a; color: #ccc; padding: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Wali Cloth House</h1>
    <p>Quality fabric for your home and wardrobe</p>
  </header>
  <h2>Our Products</h2>
  <div class="grid">
    <div class="card"><img src="blackshot.png">Clothes</div>
    <div class="card">Bed Sheets</div>
    <div class="card">Sofa Covers</div>
    <div class="card">Pillows</div>
    <div class="card">Quilts</div>
    <div class="card">Quilt Covers</div>
    <div class="card">Blankets</div>
  </div>
  <a class="btn" href="https://wa.me/923275534903">Order on WhatsApp</a>
  <footer>© Wali Cloth House</footer>

</html>
